<!doctype html>
<html lang="de"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FX Testseite</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#app{position:fixed;inset:0}#app canvas{display:block;width:100%;height:100%}
#bar{position:fixed;left:0;right:0;top:0;height:10%;background:rgba(255,0,0,.12);pointer-events:none}
#bar2{position:fixed;left:0;right:0;bottom:0;height:12%;background:rgba(255,0,0,.12);pointer-events:none}
#hud{position:fixed;left:6px;top:6px;z-index:5;display:flex;flex-wrap:wrap;gap:4px;max-width:90vw}
#hud button{font:11px sans-serif;padding:3px 6px}
body.nohud #hud,body.nohud #bar,body.nohud #bar2{display:none}
</style></head><body>
<div id="app"></div><div id="bar"></div><div id="bar2"></div><div id="hud"></div>
<script type="module" src="./fx.js"></script>
</body></html>
